name: Daily Zyphuel Fuel Intelligence & Article Auto-Updater

on:
  schedule:
    # Daily 02:00 UTC (07:00 AM PKT - subah OGRA petroleum update ke foran baad)
    - cron: '0 2 * * *'
  workflow_dispatch: # GitHub Actions tab se manual run button

jobs:
  update-fuel-articles:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git Committer
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Zyphuel Fuel Master Updater
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          python scripts/zyphuel_fuel_updater_master.py --git-commit
