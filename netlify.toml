[build]
  command = "npm run build"
  publish = "dist"

# HTML files - always fresh for crawlers and visitors
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "all, max-image-preview:large, max-snippet:-1, max-video-preview:-1"

# Cache static assets immutably
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[redirects]]
  from = "/about"
  to = "/about/index.html"
  status = 200

[[redirects]]
  from = "/services"
  to = "/services/index.html"
  status = 200

[[redirects]]
  from = "/download"
  to = "/download/index.html"
  status = 200

[[redirects]]
  from = "/order"
  to = "/order/index.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact/index.html"
  status = 200

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy/index.html"
  status = 200

[[redirects]]
  from = "/terms-of-use"
  to = "/terms-of-use/index.html"
  status = 200

# Fallback for SPA navigation
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
