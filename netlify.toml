[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  NODE_VERSION = "20"
  VITE_BUSINESS_HOURS_TIMEZONE = "Asia/Karachi"
  VITE_ORDER_INTAKE_START = "08:00"
  VITE_ORDER_INTAKE_END = "22:00"
  VITE_ENABLE_QA_ORDER_BYPASS = "false"
  VITE_DISABLE_ORDER_CUTOFF = "false"

[context.deploy-preview.environment]
  VITE_DISABLE_ORDER_CUTOFF = "false"
  VITE_ENABLE_QA_ORDER_BYPASS = "false"

[context.branch-deploy.environment]
  VITE_DISABLE_ORDER_CUTOFF = "false"
  VITE_ENABLE_QA_ORDER_BYPASS = "false"

# ---------------------------------------------------------------------------
# Canonical URL hygiene (crawl budget)
# ---------------------------------------------------------------------------
# Every page also existed at its /x/index.html path, which returned HTTP 200:
# a second full copy of the same document for crawlers to index and spend
# budget on. 301 those shapes onto the one canonical trailing-slash URL.
# `force = true` is required, otherwise an existing file wins over the rule.

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/*/index.html"
  to = "/:splat/"
  status = 301
  force = true

# HTML files - always fresh for crawlers and visitors
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"

# 404 error page header - tell search engines not to index error pages
[[headers]]
  for = "/404.html"
  [headers.values]
    X-Robots-Tag = "noindex, follow"
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/order/*"
  [headers.values]
    Link = "<https://zyphuel.netlify.app/order/>; rel=\"canonical\""
    X-Robots-Tag = "index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/download/*"
  [headers.values]
    Link = "<https://zyphuel.netlify.app/download/>; rel=\"canonical\""
    X-Robots-Tag = "index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    Cache-Control = "public, max-age=0, must-revalidate"

# Cache static assets immutably
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Scroll-animation frame sequences (1,200+ JPEGs across the 4 canvas heroes).
# Without these rules they inherited the global `max-age=0, must-revalidate` and every
# page view revalidated hundreds of frames.
[[headers]]
  for = "/ezgif-2f1a39c97e5b173b-jpg/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/services-hero-frames/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/services-section3-frames/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app-hero-frames/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app-section3-frames/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Dedicated APK headers for Android package installer
[[headers]]
  for = "/APK/*"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"Zyphuel.apk\""
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, HEAD, OPTIONS"
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/apk/*"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"Zyphuel.apk\""
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, HEAD, OPTIONS"
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"Zyphuel.apk\""
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, HEAD, OPTIONS"
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
    X-Content-Type-Options = "nosniff"

# Active plugins
[[headers]]
  for = "/plugins/*"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Explicit 301 normalization to canonical trailing slash URLs
[[redirects]]
  from = "/about"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/services"
  to = "/services/"
  status = 301

[[redirects]]
  from = "/download"
  to = "/download/"
  status = 301

[[redirects]]
  from = "/order"
  to = "/order/"
  status = 301

[[redirects]]
  from = "/contact"
