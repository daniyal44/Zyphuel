# Blog sub-pages are prerendered as /blog/slug/index.html
# No redirect needed — Netlify serves them directly

[[redirects]]
  from = "/sitemap"
  to = "/sitemap/"
  status = 301

# Direct APK delivery routes (aliases, lowercase paths & root links served with 200)
[[redirects]]
  from = "/apk/Zyphuel.apk"
  to = "/APK/Zyphuel.apk"
  status = 200

[[redirects]]
  from = "/apk/zyphuel.apk"
  to = "/APK/Zyphuel.apk"
  status = 200

[[redirects]]
  from = "/APK/zyphuel.apk"
  to = "/APK/Zyphuel.apk"
  status = 200

[[redirects]]
  from = "/Zyphuel.apk"
  to = "/APK/Zyphuel.apk"
  status = 200

[[redirects]]
  from = "/zyphuel.apk"
  to = "/APK/Zyphuel.apk"
  status = 200

[[redirects]]
  from = "/download/Zyphuel.apk"
  to = "/APK/Zyphuel.apk"
  status = 200

[[redirects]]
  from = "/download/zyphuel.apk"
  to = "/APK/Zyphuel.apk"
  status = 200

# Genuine 404 status for missing paths (prevents Google Soft 404 penalty)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
