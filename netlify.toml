[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  NODE_VERSION = "20"

# HTML files - always fresh for crawlers and visitors
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "all, max-image-preview:large, max-snippet:-1, max-video-preview:-1"

# 404 error page header - tell search engines not to index error pages
[[headers]]
  for = "/404.html"
  [headers.values]
    X-Robots-Tag = "noindex, follow"
    Cache-Control = "no-cache, no-store, must-revalidate"

# Cache static assets immutably
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Explicit 301 normalization to canonical trailing slash URLs
[[redirects]]
  from = "/about"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/services"
  to = "/services/"
  status = 301

[[redirects]]
  from = "/download"
  to = "/download/"
  status = 301

[[redirects]]
  from = "/order"
  to = "/order/"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/privacy"
  to = "/privacy/"
  status = 301

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy/"
  status = 301

[[redirects]]
  from = "/privacy-policy/"
  to = "/privacy/"
  status = 301

[[redirects]]
  from = "/terms"
  to = "/terms/"
  status = 301

[[redirects]]
  from = "/terms-of-use"
  to = "/terms/"
  status = 301

[[redirects]]
  from = "/terms-of-use/"
  to = "/terms/"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/blog/:splat"
  to = "/blog/:splat/"
  status = 301

# Genuine 404 status for missing paths (prevents Google Soft 404 penalty)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
