<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img">
  <title>Scroll scrub: frame file requested vs scrub position</title>
  <rect width="960" height="620" fill="#ffffff"/>
  <text x="480.0" y="36" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">Scroll scrub: frame file requested vs scrub position</text>
  <text x="480.0" y="62" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Zyphuel canvas heroes · 100 scrub steps mapped onto every third source frame</text>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="120" y1="520.0" x2="920" y2="520.0"/>
    <line x1="120" y1="455.9" x2="920" y2="455.9"/>
    <line x1="120" y1="391.9" x2="920" y2="391.9"/>
    <line x1="120" y1="327.8" x2="920" y2="327.8"/>
    <line x1="120" y1="263.8" x2="920" y2="263.8"/>
    <line x1="120" y1="199.7" x2="920" y2="199.7"/>
    <line x1="120" y1="135.6" x2="920" y2="135.6"/>
    <line x1="120.0" y1="110" x2="120.0" y2="520"/>
    <line x1="280.0" y1="110" x2="280.0" y2="520"/>
    <line x1="440.0" y1="110" x2="440.0" y2="520"/>
    <line x1="600.0" y1="110" x2="600.0" y2="520"/>
    <line x1="760.0" y1="110" x2="760.0" y2="520"/>
    <line x1="920.0" y1="110" x2="920.0" y2="520"/>
  </g>
  <line x1="120" y1="110" x2="120" y2="520" stroke="#334155" stroke-width="2"/>
  <line x1="120" y1="520" x2="920" y2="520" stroke="#334155" stroke-width="2"/>
  <g fill="#475569" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="end">
    <text x="108" y="525.0">0</text>
    <text x="108" y="460.9">50</text>
    <text x="108" y="396.9">100</text>
    <text x="108" y="332.8">150</text>
    <text x="108" y="268.8">200</text>
    <text x="108" y="204.7">250</text>
    <text x="108" y="140.6">300</text>
  </g>
  <g fill="#475569" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">
    <text x="120.0" y="544">0</text>
    <text x="280.0" y="544">20</text>
    <text x="440.0" y="544">40</text>
    <text x="600.0" y="544">60</text>
    <text x="760.0" y="544">80</text>
    <text x="920.0" y="544">100</text>
  </g>
  <text x="520.0" y="576" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">Scrub position (0–99 of the 100-frame sequence)</text>
  <text x="40" y="315.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#334155" text-anchor="middle" transform="rotate(-90 40 315.0)">Source frame file number</text>
  <polyline points="120.0,518.7 200.0,480.3 280.0,441.8 360.0,403.4 440.0,365.0 520.0,326.5 600.0,288.1 680.0,249.7 760.0,211.2 840.0,172.8 912.0,138.2" fill="none" stroke="#0284c7" stroke-width="3" stroke-dasharray="none"/>
  <polyline points="120.0,514.9 200.0,476.4 280.0,438.0 360.0,399.6 440.0,361.1 520.0,322.7 600.0,284.2 680.0,245.8 760.0,207.4 840.0,168.9 912.0,134.3" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 5"/>
  <line x1="136" y1="128" x2="170" y2="128" stroke="#0284c7" stroke-width="4" stroke-dasharray="none"/>
  <text x="180" y="133" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Fixed: 3x + 1 (frame 001, 004, 007 …)</text>
  <line x1="136" y1="152" x2="170" y2="152" stroke="#dc2626" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="180" y="157" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Buggy: 3x + 4 (one file ahead of the cache slot)</text>
  <text x="120" y="604" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#64748b">The buggy line asks for frame 301 at the last step. That file does not exist, so the request 404s and the</text>
  <text x="120" y="623" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#64748b">smoothing loop keeps falling back to an image with naturalWidth 0 — the canvas looks frozen while scrolling.</text>
  <text x="120" y="642" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#64748b">Fixed mapping stays inside 1…298, so every requested frame exists and the animation advances on every scroll tick.</text>
</svg>
