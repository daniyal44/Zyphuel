<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-label="Frame requests per canvas hero: before 300-frame sequence versus after 100-frame sequence">
  <rect width="720" height="420" fill="#0b1120"/>
  <text x="24" y="34" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Frame requests per canvas hero — before vs after</text>
  <text x="24" y="56" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">Zyphuel scroll scrub · measured 2026-10-30 on the local production build</text>

  <!-- y axis -->
  <line x1="70" y1="80" x2="70" y2="330" stroke="#334155" stroke-width="1"/>
  <!-- y grid + labels: 0..300 -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">
    <line x1="70" y1="330" x2="690" y2="330" stroke="#334155" stroke-width="1"/>
    <line x1="70" y1="288" x2="690" y2="288" stroke="#1e293b" stroke-width="1"/>
    <line x1="70" y1="247" x2="690" y2="247" stroke="#1e293b" stroke-width="1"/>
    <line x1="70" y1="205" x2="690" y2="205" stroke="#1e293b" stroke-width="1"/>
    <line x1="70" y1="163" x2="690" y2="163" stroke="#1e293b" stroke-width="1"/>
    <line x1="70" y1="122" x2="690" y2="122" stroke="#1e293b" stroke-width="1"/>
    <line x1="70" y1="80" x2="690" y2="80" stroke="#1e293b" stroke-width="1"/>
    <text x="60" y="334" text-anchor="end">0</text>
    <text x="60" y="292" text-anchor="end">50</text>
    <text x="60" y="250" text-anchor="end">100</text>
    <text x="60" y="209" text-anchor="end">150</text>
    <text x="60" y="167" text-anchor="end">200</text>
    <text x="60" y="125" text-anchor="end">250</text>
    <text x="60" y="84" text-anchor="end">300</text>
  </g>
  <text x="20" y="210" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" transform="rotate(-90 20 210)" text-anchor="middle">frame requests (count)</text>

  <!-- groups: Home, Services hero, Services §3, Download hero -->
  <!-- before = 300 (full sequence) / mobile Home measured 242; after measured values -->
  <g>
    <!-- Home -->
    <rect x="100" y="80"  width="34" height="250" fill="#ef4444" opacity="0.85"/>
    <rect x="138" y="245" width="34" height="85"  fill="#22c55e"/>
    <text x="136" y="74"  fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">300</text>
    <text x="155" y="239" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">102</text>
    <text x="136" y="350" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Home hero</text>

    <!-- Services hero -->
    <rect x="238" y="80"  width="34" height="250" fill="#ef4444" opacity="0.85"/>
    <rect x="276" y="245" width="34" height="85"  fill="#22c55e"/>
    <text x="274" y="74"  fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">300</text>
    <text x="293" y="239" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">102</text>
    <text x="274" y="350" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Services hero</text>

    <!-- Services section 3 -->
    <rect x="376" y="80"  width="34" height="250" fill="#ef4444" opacity="0.85"/>
    <rect x="414" y="254" width="34" height="76"  fill="#22c55e"/>
    <text x="412" y="74"  fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">300</text>
    <text x="431" y="248" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">91</text>
    <text x="412" y="350" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Services §3</text>

    <!-- Download hero -->
    <rect x="514" y="80"  width="34" height="250" fill="#ef4444" opacity="0.85"/>
    <rect x="552" y="254" width="34" height="76"  fill="#22c55e"/>
    <text x="550" y="74"  fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">300</text>
    <text x="569" y="248" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">91</text>
    <text x="550" y="350" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Download hero</text>
  </g>

  <!-- legend -->
  <rect x="470" y="376" width="14" height="14" fill="#ef4444" opacity="0.85"/>
  <text x="492" y="388" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">before (300-frame sequence)</text>
  <rect x="470" y="398" width="14" height="14" fill="#22c55e"/>
  <text x="492" y="410" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">after (100-frame sequence, measured)</text>
  <text x="24" y="388" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">x-axis: canvas hero   ·   y-axis: image requests</text>
</svg>
